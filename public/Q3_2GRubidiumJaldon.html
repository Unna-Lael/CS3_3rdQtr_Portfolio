<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q3 2nd Graded</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Comic Sans MS", "Arial", sans-serif;
  background: #fff0f6;
  position: relative;
}

#hearts {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.heart {
  position: absolute;
  width: 15px;
  height: 15px;
  background: #ff4d94;
  transform: rotate(45deg);
  animation-name: floatUp;
  animation-timing-function: ease-in;
  animation-fill-mode: forwards;
  opacity: 0.7;
}

.heart:before,
.heart:after {
  content: "";
  position: absolute;
  width: 15px;
  height: 15px;
  background: #ff4d94;
  border-radius: 50%;
}

.heart:before { top: -7.5px; left: 0; }
.heart:after { left: -7.5px; top: 0; }

@keyframes floatUp {
  0% { transform: translateY(0) rotate(45deg); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-800px) rotate(45deg); opacity: 0; }
}

form {
  position: relative;
  z-index: 10;
  max-width: 650px;
  margin: 50px auto;
  background: rgba(255, 240, 246, 0.95);
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
  animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

h1 {
  text-align: center;
  color: #d63384;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

fieldset {
  border: 2px solid #ff99c8;
  border-radius: 10px;
  margin-bottom: 20px;
  padding: 15px;
}

legend {
  padding: 0 10px;
  font-weight: bold;
  color: #c9184a;
}

label {
  display: block;
  margin-bottom: 14px;
  color: #6a1a33;
}

input, select, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1.5px solid #ffb3d9;
  background-color: #fff;
  transition: all 0.3s ease;
  font-family: inherit;
}

textarea { resize: vertical; }

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #ff4d94;
  box-shadow: 0 0 8px rgba(255, 77, 148, 0.6);
  background-color: #fff7fb;
}

.invalid {
  border: 2px solid #ff1a1a;
  background-color: #ffe6e6;
  animation: shake 0.3s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  50% { transform: translateX(3px); }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0); }
}

.radio-group input { width: auto; margin-right: 5px; }

button {
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  transition: transform 0.2s, box-shadow 0.2s;
}

button[type="submit"] { background-color: #ff4d94; color: white; }
button[type="reset"] { background-color: #adb5bd; color: white; }

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div id="hearts"></div>

<form method="post" action="submit"
      onsubmit="return confirmSubmit();"
      onreset="return confirmReset();">

  <h1>Club Application Form</h1>

  <!-- FIELDSET 1 -->
  <fieldset>
    <legend>Your Student Profile!</legend>

    <label>
      Student ID:
      <input type="number" name="studentID" required>
    </label>

    <label>
      Full Name:
      <input type="text" name="fullname" required onblur="checkEmpty(this)">
    </label>

    <label>
      Birthday:
      <input type="date" name="birthday" required>
    </label>

    <label>
      Email Address:
      <input type="email" name="email" required>
    </label>
  </fieldset>

  <!-- FIELDSET 2 -->
  <fieldset>
    <legend>Your Club Details</legend>

    <label>
      Mobile Phone:
      <input type="text" name="mobile" required onblur="checkEmpty(this)">
    </label>

    <label>
      Grade Level:
      <select name="grade" required>
        <option value="">Select Grade Level</option>
        <option value="lv7">Grade 7</option>
        <option value="lv8">Grade 8</option>
        <option value="lv9">Grade 9</option>
        <option value="lv10">Grade 10</option>
      </select>
    </label>

    <label class="radio-group">
      Intern / Extern:
      <br>
      <input type="radio" name="status" value="intern_role" required> Intern
      <input type="radio" name="status" value="extern_role"> Extern
    </label>

    <label>
      Preferred Organization:
      <select name="club" required>
        <option value="">Choose One</option>
        <option value="debate">Debate Club</option>
        <option value="arts">Art Club</option>
        <option value="literature">Literature Club</option>
        <option value="cs">Robotics/CS Club</option>
        <option value="science">Science Club</option>
        <option value="music">Music Club</option>
        <option value="math">Math Club</option>
        <option value="languages">Foreign Languages Club</option>
        <option value="sports">Sports Club</option>
      </select>
    </label>

    <label>
      Why do you want to join this club?
      <textarea name="reason" rows="4" required onblur="checkEmpty(this)"></textarea>
    </label>
  </fieldset>

  <button type="submit">Submit</button>
  <button type="reset">Reset</button>

</form>

<script>
const heartsContainer = document.getElementById('hearts');

function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';

  heart.style.left = Math.random() * window.innerWidth + 'px';

  heart.style.top = window.innerHeight + Math.random() * 50 + 'px';
  
  const size = 10 + Math.random() * 15;
  heart.style.width = size + 'px';
  heart.style.height = size + 'px';
  heart.style.animationDuration = (4 + Math.random() * 4) + 's';

  heartsContainer.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 300);

function confirmSubmit() {
  if (confirm("Are you sure you want to submit this application?\nThis choice cannot be undone.")) {
    alert("Submitted!");
    return true;
  }
  return false;
}

function confirmReset() {
  return confirm("Reset all progress?\nEverything will be lost.");
}

function checkEmpty(el) {
  if (el.value.trim() === "") {
    el.classList.add("invalid");
  } else {
    el.classList.remove("invalid");
  }
}
</script>

</body>
</html>
